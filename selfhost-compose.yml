services:
  postgres:
    image: postgres:14
    container_name: stratum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stratum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (backend/.env)}
      POSTGRES_DB: ${POSTGRES_DB:-stratum_db}
    ports:
      - "${STRATUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - stratum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stratum_user} -d ${POSTGRES_DB:-stratum_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: stratum-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-stratum_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY (backend/.env)}
    ports:
      - "${STRATUM_MINIO_PORT:-9000}:9000"
      - "${STRATUM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - stratum_minio_data:/data

  backend:
    image: python:3.13-slim
    container_name: stratum-backend
    restart: unless-stopped
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    env_file:
      - ./backend/.env
    environment:
      AUTH_MODE: ${AUTH_MODE:-local}
      DEPLOYMENT_MODE: self_hosted
      SELF_HOST_BUNDLE: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-stratum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (backend/.env)}
      POSTGRES_DB: ${POSTGRES_DB:-stratum_db}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stratum_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (backend/.env)}@postgres:5432/${POSTGRES_DB:-stratum_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-stratum_minio_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY (backend/.env)}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-stratum-files}
      MINIO_USE_SSL: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:19006,http://localhost:5173,http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      sh -c "
      pip install --no-cache-dir -r requirements-selfhost.txt &&
      alembic upgrade head &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "${STRATUM_BACKEND_PORT:-8000}:8000"

  stratum-web:
    image: node:20-alpine
    container_name: stratum-web
    restart: unless-stopped
    working_dir: /workspace/frontend/stratum-app
    volumes:
      - ./frontend/stratum-app:/workspace/frontend/stratum-app
    environment:
      EXPO_PUBLIC_API_URL: ${STRATUM_WEB_API_URL:-http://localhost:8000/api}
      NODE_ENV: production
    command: >
      sh -c "
      apk add --no-cache bash &&
      npm install --include=dev &&
      npm run build:web &&
      cp serve.json dist/serve.json &&
      npx serve@14.2.4 dist -l 19006
      "
    ports:
      - "${STRATUM_WEB_PORT:-19006}:19006"
    depends_on:
      backend:
        condition: service_healthy

  dashboard:
    image: node:20-alpine
    container_name: stratum-dashboard
    restart: unless-stopped
    working_dir: /workspace/frontend/dashboard
    volumes:
      - ./frontend/dashboard:/workspace/frontend/dashboard
    environment:
      VITE_API_URL: ${STRATUM_DASHBOARD_API_URL:-http://localhost:8000/api}
      NODE_ENV: production
    command: >
      sh -c "
      npm install --include=dev &&
      npm run build &&
      npx serve@14.2.4 dist -l 5173
      "
    ports:
      - "${STRATUM_DASHBOARD_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  stratum_postgres_data:
  stratum_minio_data:
