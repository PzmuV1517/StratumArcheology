name: Bundle Launcher Packages

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - stratum_bundle.py
      - .github/workflows/bundle-launcher-binaries.yml
  pull_request:
    branches: [main, develop]
    paths:
      - stratum_bundle.py
      - .github/workflows/bundle-launcher-binaries.yml

jobs:
  build-windows-exe:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --onefile --name stratum-bundle stratum_bundle.py

      - name: Smoke test executable
        run: .\dist\stratum-bundle.exe --help

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-bundle-windows-exe
          path: dist/stratum-bundle.exe
          if-no-files-found: error
          retention-days: 14

  build-macos-app:
    name: Build macOS .app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS application bundle
        run: pyinstaller --noconfirm --onedir --windowed --name stratum-bundle stratum_bundle.py

      - name: Smoke test app bundle binary
        run: ./dist/stratum-bundle.app/Contents/MacOS/stratum-bundle --help

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-bundle-macos-app
          path: dist/stratum-bundle.app
          if-no-files-found: error
          retention-days: 14

  build-linux-deb:
    name: Build Linux .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux launcher binary
        run: pyinstaller --noconfirm --onefile --name stratum-bundle stratum_bundle.py

      - name: Smoke test launcher
        run: ./dist/stratum-bundle --help

      - name: Build .deb package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          PKG_ROOT="package-root"
          mkdir -p "$PKG_ROOT/DEBIAN" "$PKG_ROOT/usr/local/bin"
          install -m 0755 dist/stratum-bundle "$PKG_ROOT/usr/local/bin/stratum-bundle"
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: stratum-bundle
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: QuantumBits Team <maintainer@localhost>
          Depends: docker.io | docker-ce | docker-engine, docker-compose-plugin | docker-compose
          Description: STRATUM self-host bundle launcher
           Cross-platform CLI launcher for running the STRATUM self-host stack.
          EOF
          dpkg-deb --build "$PKG_ROOT" "dist/stratum-bundle_${VERSION}_amd64.deb"

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-bundle-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
