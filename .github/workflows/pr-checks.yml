name: PR Checks (STRATUM)

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax & import check
        run: |
          python -m compileall app

      - name: Ruff lint check
        run: |
          pip install ruff
          ruff check . --config ruff.toml

  frontend:
    name: Frontend (TypeScript / Expo Web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/stratum-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint check
        run: npx eslint . --config eslint.config.js

      - name: Expo web build smoke test
        run: npx expo export --platform web