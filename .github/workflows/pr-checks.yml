name: PR Checks (STRATUM)

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax & import check
        run: |
          python -m compileall app

      - name: Start FastAPI (smoke test)
        run: |
          python -m uvicorn app.main:app --port 8000 &
          sleep 5
          curl -f http://127.0.0.1:8000/health || exit 1

  frontend:
    name: Frontend (TypeScript / Expo Web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/stratum-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript type check (if present)
        run: |
          npm run typecheck || echo "No typecheck script defined"

      - name: Lint (if present)
        run: |
          npm run lint || echo "No lint script defined"

      - name: Expo web build smoke test
        run: |
          npx expo export --platform web