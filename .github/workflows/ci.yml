name: CI - Lint & Format

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check . --config ruff.toml

      - name: Run ruff formatter check
        run: ruff format --check . --config ruff.toml

  frontend-lint:
    name: Frontend (Expo/React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/stratum-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint . --config eslint.config.js

      - name: Run Prettier check
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json}" --ignore-path .gitignore
