name: StratumWatch
options:
  bundleIdPrefix: com.pzmuv1517.stratum
  deploymentTarget:
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  StratumWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "StratumWatch Watch App"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pzmuv1517.stratum.watchkitapp
        PRODUCT_NAME: "StratumWatch Watch App"
        INFOPLIST_FILE: "StratumWatch Watch App/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_ASSET_PATHS: '"StratumWatch Watch App/Preview Content"'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
