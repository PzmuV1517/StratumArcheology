# Tracepatch Configuration
# See: https://github.com/levinismynameirl/tracepatch

# Tracing behavior
ignore_modules = ["unittest.mock", "logging", "slowapi", "starlette"]  # Module prefixes to exclude
# include_modules = ["myapp"]  # Allowlist mode: only trace these modules
max_depth = 30  # Maximum call nesting depth
max_calls = 10000  # Stop tracing after this many calls
max_repr = 120  # Max length for repr() of args/returns

# Cache settings
cache = true  # Auto-save traces to .tracepatch_cache/
# cache_dir = ".custom_cache"  # Custom cache directory
auto_save = true  # Automatically save traces on exit

# Display settings
show_args = false  # Show function arguments in tree (disabled to avoid MagicMock repr errors)
show_return = true  # Show return values in tree
tree_style = "ascii"  # "ascii" or "unicode"
# default_label = "my-trace"  # Default label for traces

# Test configuration (for `tph setup`)
[[test.files]]
path = "app/rate_limiter.py"
functions = ["_get_client_key", "rate_limit_exceeded_handler"]

# Custom test script since these functions need mock Request objects
[test.custom]
enabled = true
script = """
from unittest.mock import MagicMock
from slowapi.errors import RateLimitExceeded
from app.rate_limiter import _get_client_key, rate_limit_exceeded_handler

# Test 1: Unauthenticated request (IP-based key)
mock_request = MagicMock()
mock_request.state.current_user = None
mock_request.client.host = "192.168.1.100"
print(f"Test 1 - IP key: {_get_client_key(mock_request)}")

# Test 2: Authenticated request (user-based key)
mock_request2 = MagicMock()
mock_request2.state.current_user = MagicMock(id="user-abc-123")
print(f"Test 2 - User key: {_get_client_key(mock_request2)}")

# Test 3: Rate limit exceeded handler
mock_exc = MagicMock(spec=RateLimitExceeded)
mock_exc.detail = "Rate limit exceeded: 5 per 1 minute"
response = rate_limit_exceeded_handler(mock_request, mock_exc)
print(f"Test 3 - 429 response status: {response.status_code}")
"""